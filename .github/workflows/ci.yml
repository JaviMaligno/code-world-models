name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  paper:
    name: LaTeX presentation guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-bibtex-extra biber
      - name: Compile paper and check overfull / undefined refs
        run: bash scripts/check_latex.sh

  tests:
    name: Python tests (Azure-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      # Paper 3's derived constants are computed from the instruments'
      # attributes, never transcribed: the emitter re-derives them and the
      # audit checks the documents against it at the printed precision. On
      # paper 2 every peer-review arithmetic error was a hand-computed
      # constant, so this runs on every push rather than on trust.
      # The emitter READS the calibrations and the emitted MEASUREMENTS, which
      # are checked into the repo rather than recomputed here (they are
      # million-rollout runs: scripts/t3_unrecorded_measurements.py,
      # t2_unrecorded_measurements.py, t2_drag_cap_and_switch_rate.py,
      # t7_margin_variant_betti.py, t3_quadratic_constant.py,
      # t3_isotropy_window_bound.py -- each resumable per cell). The audit
      # below fails loudly if a document drifts from any of them, and
      # tests/test_unrecorded_measurements.py guards their structure.
      - name: Re-derive paper 3's campaign constants
        run: PYTHONPATH=src python scripts/t_campaign_constants.py
      - name: Audit paper 3's quoted constants against the derived values
        run: PYTHONPATH=src python scripts/audit_paper3_numbers.py
      # The claims ratchet: scope, evidence labels and censored zeros. It fails
      # only when a rule goes ABOVE results/paper_claims_baseline.json, so the
      # remaining count can shrink but never grow. Exemptions live in
      # docs/paper3/claims-allowlist.txt and each carries a written
      # justification -- an entry without one is a hard error, not a pass.
      - name: Lint paper 3's claims against the ratchet
        run: |
          PYTHONPATH=src python scripts/audit_paper_claims.py             docs/paper3/main.tex             --allowlist docs/paper3/claims-allowlist.txt
      - name: Run test suite
        run: pytest -q
